name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Web build + generate Android project
        run: npm run android:prepare

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && format('{0}/lumen.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/lumen.jks"
            ./gradlew assembleRelease --no-daemon
            mkdir -p ../out && cp app/build/outputs/apk/release/*.apk ../out/lumen.apk
          else
            ./gradlew assembleDebug --no-daemon
            mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/lumen.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: out/lumen.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/lumen.apk
